<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>حساباتي</title>
  <meta name="description" content="برنامج محاسبة بسيط: بيع وشراء ومصاريف ومخزن ورواتب وتقارير بالدينار العراقي">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="حساباتي">
  <style>
:root {
  --bg: #f2f2f7;
  --card: #ffffff;
  --text: #1c1c1e;
  --muted: #6b7280;
  --line: #e5e5ea;
  --primary: #0f766e;
  --primary-soft: #ccfbf1;
  --green: #15803d;
  --green-soft: #dcfce7;
  --red: #dc2626;
  --red-soft: #fee2e2;
  --amber: #b45309;
  --amber-soft: #fef3c7;
  --blue: #1d4ed8;
  --blue-soft: #dbeafe;
  --on-primary: #ffffff;
  --radius: 14px;
  --tabbar-h: 58px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000;
    --card: #1c1c1e;
    --text: #f2f2f7;
    --muted: #9ca3af;
    --line: #2c2c2e;
    --primary: #2dd4bf;
    --primary-soft: #134e4a;
    --green: #4ade80;
    --green-soft: #14532d;
    --red: #f87171;
    --red-soft: #450a0a;
    --amber: #fbbf24;
    --amber-soft: #451a03;
    --blue: #60a5fa;
    --blue-soft: #172554;
    --on-primary: #042f2e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --bg: #000000;
    --card: #1c1c1e;
    --text: #f2f2f7;
    --muted: #9ca3af;
    --line: #2c2c2e;
    --primary: #2dd4bf;
    --primary-soft: #134e4a;
    --green: #4ade80;
    --green-soft: #14532d;
    --red: #f87171;
    --red-soft: #450a0a;
    --amber: #fbbf24;
    --amber-soft: #451a03;
    --blue: #60a5fa;
    --blue-soft: #172554;
    --on-primary: #042f2e;
    color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Arabic", "Geeza Pro", "Segoe UI", Tahoma, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--primary); text-decoration: none; }

/* Top bar */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: grid; grid-template-columns: 64px 1fr 64px; align-items: center;
  padding: calc(var(--safe-t) + 8px) 12px 8px;
  background: color-mix(in srgb, var(--bg) 85%, transparent);
  backdrop-filter: saturate(180%) blur(16px);
  -webkit-backdrop-filter: saturate(180%) blur(16px);
  border-bottom: 1px solid var(--line);
}
.topbar h1 { margin: 0; font-size: 17px; font-weight: 700; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#topAction { justify-self: end; }
.icon-btn { background: none; border: 0; font-size: 32px; line-height: 1; color: var(--primary); padding: 0 6px; cursor: pointer; justify-self: start; }
.link-btn { background: none; border: 0; color: var(--primary); font-weight: 600; padding: 6px 4px; cursor: pointer; }

.view { padding: 12px 16px calc(var(--tabbar-h) + var(--safe-b) + 24px); max-width: 760px; margin: 0 auto; }

/* Tab bar */
.tabbar {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 20;
  display: grid; grid-template-columns: repeat(5, 1fr);
  height: calc(var(--tabbar-h) + var(--safe-b)); padding-bottom: var(--safe-b);
  background: color-mix(in srgb, var(--card) 88%, transparent);
  backdrop-filter: saturate(180%) blur(16px);
  -webkit-backdrop-filter: saturate(180%) blur(16px);
  border-top: 1px solid var(--line);
}
.tabbar a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--muted); font-size: 11px; }
.tabbar a .ti { font-size: 21px; line-height: 1; filter: grayscale(1); opacity: .75; }
.tabbar a.active { color: var(--primary); font-weight: 700; }
.tabbar a.active .ti { filter: none; opacity: 1; }

/* Cards & lists */
.card { background: var(--card); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
.section-title { font-size: 13px; color: var(--muted); margin: 18px 6px 6px; font-weight: 600; }
.list { background: var(--card); border-radius: var(--radius); overflow: hidden; margin-bottom: 12px; }
.row {
  display: flex; align-items: center; gap: 10px; padding: 12px 14px;
  border-bottom: 1px solid var(--line); cursor: pointer; width: 100%;
  background: none; border-inline: 0; border-top: 0; text-align: start;
}
.row:last-child { border-bottom: 0; }
.row:active { background: var(--bg); }
.row .grow { flex: 1; min-width: 0; }
.row .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .s { font-size: 13px; color: var(--muted); }
.row .end { text-align: end; white-space: nowrap; }
.row .chev { color: var(--muted); font-size: 18px; }
.empty { text-align: center; color: var(--muted); padding: 32px 12px; }

.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.stat { background: var(--card); border-radius: var(--radius); padding: 12px 14px; }
.stat .l { font-size: 12.5px; color: var(--muted); }
.stat .v { font-size: 19px; font-weight: 800; margin-top: 2px; word-break: break-word; }
.stat.wide { grid-column: 1 / -1; }
.stat.good .v { color: var(--green); }
.stat.bad .v { color: var(--red); }
.stat.warn .v { color: var(--amber); }

.actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
.action {
  background: var(--card); border: 0; border-radius: var(--radius); padding: 14px 6px;
  display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; font-size: 13.5px; font-weight: 600;
}
.action .ai { font-size: 26px; line-height: 1; }
.action:active { transform: scale(.97); }

.badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; }
.b-green { background: var(--green-soft); color: var(--green); }
.b-red { background: var(--red-soft); color: var(--red); }
.b-amber { background: var(--amber-soft); color: var(--amber); }
.b-blue { background: var(--blue-soft); color: var(--blue); }
.b-gray { background: var(--bg); color: var(--muted); }
.pos { color: var(--green); }
.neg { color: var(--red); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.bold { font-weight: 700; }

/* Forms */
.field { display: block; margin-bottom: 12px; }
.field > span { display: block; font-size: 13px; color: var(--muted); margin: 0 4px 4px; font-weight: 600; }
.input, select.input, textarea.input {
  width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--card); font-size: 16px; -webkit-appearance: none; appearance: none;
}
select.input { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: 18px 50%, 12px 50%; background-size: 6px 6px; background-repeat: no-repeat; padding-left: 30px; }
.input:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
.input[readonly] { background: var(--bg); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 0; border-radius: 12px; padding: 13px 16px; font-weight: 700; cursor: pointer;
  background: var(--primary); color: var(--on-primary); font-size: 16px; white-space: nowrap;
}
.btn.block { width: 100%; }
.btn.secondary { background: var(--primary-soft); color: var(--primary); }
.btn.danger { background: var(--red-soft); color: var(--red); }
.btn.small { padding: 7px 12px; font-size: 14px; border-radius: 10px; }
.btn:active { opacity: .85; }
.btn-row { display: flex; gap: 10px; margin-top: 8px; }
.btn-row > * { flex: 1; }

.seg { display: flex; background: var(--line); border-radius: 10px; padding: 3px; margin-bottom: 12px; gap: 2px; overflow-x: auto; }
.seg button { flex: 1; border: 0; background: none; padding: 8px 10px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; color: var(--text); }
.seg button.on { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { border: 1px solid var(--line); background: var(--card); padding: 6px 14px; border-radius: 99px; font-size: 14px; white-space: nowrap; cursor: pointer; }
.chip.on { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }

.search { position: relative; margin-bottom: 12px; }
.search input { padding-inline-start: 36px; }
.search::before { content: "⌕"; position: absolute; inset-inline-start: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 18px; }

/* Invoice editor lines */
.line { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.line:last-child { border-bottom: 0; }
.line .name { font-weight: 700; }
.line .ctrls { grid-column: 1 / -1; display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; }
.stepper { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.stepper button { width: 36px; height: 38px; border: 0; background: var(--bg); font-size: 20px; cursor: pointer; }
.stepper input { width: 56px; text-align: center; border: 0; padding: 8px 2px; background: var(--card); font-size: 16px; }
.line .price { padding: 8px 10px; }
.x-btn { border: 0; background: var(--red-soft); color: var(--red); width: 34px; height: 34px; border-radius: 50%; font-size: 18px; cursor: pointer; }

.totals .tr { display: flex; justify-content: space-between; padding: 6px 0; }
.totals .tr.big { font-size: 20px; font-weight: 800; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 10px; }

/* Tables (reports) */
.table-wrap { overflow-x: auto; background: var(--card); border-radius: var(--radius); margin-bottom: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 10px 12px; text-align: start; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12.5px; color: var(--muted); font-weight: 700; background: color-mix(in srgb, var(--bg) 60%, var(--card)); }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: end; font-variant-numeric: tabular-nums; }
tfoot td { font-weight: 800; border-top: 2px solid var(--line); }

.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 6px; }
.bar > i { display: block; height: 100%; background: var(--primary); border-radius: 99px; }

.kv { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--line); gap: 10px; }
.kv:last-child { border-bottom: 0; }
.kv .k { color: var(--muted); }
.kv .v { font-weight: 700; text-align: end; }
.kv.total { font-size: 18px; }
.kv.total .k { color: var(--text); font-weight: 800; }

/* Sheet */
.sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 40; }
.sheet {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 50; max-height: 92vh;
  background: var(--bg); border-radius: 18px 18px 0 0; display: flex; flex-direction: column;
  max-width: 760px; margin: 0 auto; animation: up .22s ease-out;
}
@keyframes up { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
.sheet-head { display: grid; grid-template-columns: 64px 1fr 64px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { margin: 0; font-size: 16px; text-align: center; }
.sheet-body { overflow-y: auto; padding: 14px 16px calc(var(--safe-b) + 20px); -webkit-overflow-scrolling: touch; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + var(--safe-b) + 16px);
  background: rgba(28,28,30,.92); color: #fff; padding: 10px 18px; border-radius: 99px; z-index: 60; font-size: 14px; max-width: 90vw; text-align: center;
}

.hero { background: linear-gradient(135deg, #0f766e, #115e59); color: #fff; border-radius: 18px; padding: 16px; margin-bottom: 12px; }
.hero .l { opacity: .85; font-size: 13px; }
.hero .v { font-size: 28px; font-weight: 800; }
.hero .sub { display: flex; justify-content: space-between; margin-top: 10px; font-size: 13px; opacity: .95; gap: 10px; }

.dlg { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 16px; }
.dlg[hidden] { display: none; }
.dlg-box { background: var(--card); color: var(--text); border-radius: 16px; padding: 18px; width: 100%; max-width: 380px; display: grid; gap: 12px; }
.dlg-msg { font-weight: 600; line-height: 1.7; }
.dlg-box textarea { font-size: 12px; direction: ltr; }
.pdf-doc {
  --bg: #f4f4f5; --card: #ffffff; --text: #111827; --muted: #4b5563; --line: #d1d5db;
  --primary: #0f766e; --primary-soft: #ccfbf1; --green: #15803d; --green-soft: #dcfce7;
  --red: #b91c1c; --red-soft: #fee2e2; --amber: #b45309; --amber-soft: #fef3c7; --blue: #1d4ed8; --blue-soft: #dbeafe;
  position: absolute; left: -10000px; top: 0; width: 794px; padding: 28px 30px;
  background: #ffffff; color: var(--text); font-size: 14px; line-height: 1.6;
}
.pdf-doc .card, .pdf-doc .stat, .pdf-doc .list, .pdf-doc .table-wrap { border: 1px solid var(--line); background: #fff; }
.pdf-doc .table-wrap { overflow: visible; }
.pdf-doc th { background: #f3f4f6; }
.pdf-doc th, .pdf-doc td { white-space: normal; }
.pdf-doc .stats { grid-template-columns: repeat(3, 1fr); }
.pdf-doc .stat.wide { grid-column: span 3; }
.pdf-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; border-bottom: 3px solid var(--primary); padding-bottom: 12px; margin-bottom: 16px; }
.pdf-shop { font-size: 24px; font-weight: 800; color: var(--primary); }
.pdf-meta { text-align: left; }
.pdf-title { font-size: 18px; font-weight: 800; }
.pdf-foot { margin-top: 18px; padding-top: 8px; border-top: 1px solid var(--line); text-align: center; color: var(--muted); font-size: 12px; }
.wa-btn { background: #25d366; color: #063d1d; text-decoration: none; }
.picker { position: relative; }
.picker .search { margin-bottom: 0; }
.picker-list { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-top: 6px; max-height: 300px; overflow-y: auto; box-shadow: 0 6px 20px rgba(0,0,0,.12); }
.picker-list .row { padding: 10px 12px; }
.name-hint { margin: 0 4px 12px; font-size: 13.5px; min-height: 4px; }
.name-hint .nh-ok { color: var(--green); font-weight: 600; }
.name-hint .nh-warn { color: var(--muted); font-weight: 600; }
.name-hint .nh-bad { color: var(--red); font-weight: 700; }
.nh-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.name-chip { background: var(--bg); border: 1px solid var(--line); border-radius: 99px; padding: 3px 10px; font-size: 13px; }
.input.dup { border-color: var(--red); outline: 2px solid var(--red); outline-offset: -1px; }
.line .ranges { grid-column: 1 / -1; border-top: 1px dashed var(--line); padding-top: 6px; display: grid; gap: 6px; }
.range-row { display: grid; grid-template-columns: 1fr auto 1fr auto; gap: 6px; align-items: center; }
.range-row .input { padding: 8px 10px; }
.embed .no-embed { display: none !important; }
.print-area { display: none; }
@media print {
  body > *:not(.print-area) { display: none !important; }
  .print-area { display: block !important; color: #000; background: #fff; padding: 10px; font-size: 13px; }
  .print-area table { font-size: 12px; }
  .print-area th, .print-area td { border-bottom: 1px solid #ccc; white-space: normal; }
  .print-area h2, .print-area h3 { margin: 4px 0; }
}

</style>
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="backBtn" aria-label="رجوع" hidden>›</button>
    <h1 id="title">حساباتي</h1>
    <span id="topAction"></span>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" id="tabbar">
    <a href="#home" data-tab="home"><span class="ti">⌂</span><span>الرئيسية</span></a>
    <a href="#sales" data-tab="sales"><span class="ti">🧾</span><span>المبيعات</span></a>
    <a href="#stock" data-tab="stock"><span class="ti">📦</span><span>المخزن</span></a>
    <a href="#reports" data-tab="reports"><span class="ti">📊</span><span>التقارير</span></a>
    <a href="#more" data-tab="more"><span class="ti">☰</span><span>المزيد</span></a>
  </nav>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" hidden aria-modal="true" role="dialog">
    <div class="sheet-head">
      <button class="link-btn" id="sheetClose">إغلاق</button>
      <h2 id="sheetTitle"></h2>
      <span></span>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <div class="dlg" id="dlg" hidden></div>

<script>
/* حساباتي — برنامج محاسبة بسيط للمحلات (بيع، شراء، مصاريف، مخزن، رواتب، تقارير)
 * كل البيانات تحفظ على الجهاز نفسه (localStorage) ويمكن أخذ نسخة احتياطية منها. */
'use strict';
(function () {
  const KEY = 'hesabati-db-v1';
  const APP_VERSION = '3.0';
  const MONTHS = ['كانون الثاني', 'شباط', 'آذار', 'نيسان', 'أيار', 'حزيران', 'تموز', 'آب', 'أيلول', 'تشرين الأول', 'تشرين الثاني', 'كانون الأول'];
  const EXP_CATS = ['إيجار', 'كهرباء', 'مولدة', 'ماء', 'نقل وتوصيل', 'صيانة', 'إنترنت واتصالات', 'ضيافة', 'أخرى'];
  const UNITS = ['قطعة', 'كارتون', 'علبة', 'كغم', 'لتر', 'متر', 'درزن'];

  /* ---------- Data ---------- */
  function defaults() {
    return {
      settings: { shopName: 'متجري', shopPhone: '', currency: 'د.ع', arabicDigits: false, openingCash: 0, lastBackup: '', invoiceTemplate: true, owners: [] },
      products: [], customers: [], suppliers: [],
      sales: [], purchases: [], expenses: [],
      payments: [], supplierPayments: [],
      employees: [], advances: [], payrolls: [], workLogs: [], withdrawals: [], incomes: [], assets: [],
      seq: { sale: 0, purchase: 0, receipt: 0 }
    };
  }
  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(KEY));
      if (d && typeof d === 'object') return normalize(d);
    } catch (e) { /* ignore */ }
    return defaults();
  }
  function normalize(d) {
    const base = defaults();
    const out = Object.assign(base, d);
    out.settings = Object.assign(defaults().settings, d.settings || {});
    out.seq = Object.assign(defaults().seq, d.seq || {});
    return out;
  }
  let db = load();
  function saveLocal() {
    try { localStorage.setItem(KEY, JSON.stringify(db)); }
    catch (e) { toast('تعذر حفظ البيانات! يرجى أخذ نسخة احتياطية فوراً.'); }
  }
  // البيانات تحفظ على الجهاز فقط (أوفلاين)
  function save() { saveLocal(); }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  /* ---------- Helpers ---------- */
  const $ = s => document.querySelector(s);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const pad = n => String(n).padStart(2, '0');
  const dstr = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const today = () => dstr(new Date());
  const thisMonth = () => today().slice(0, 7);
  const sum = (arr, f) => arr.reduce((a, x) => a + (Number(f(x)) || 0), 0);
  const byId = (arr, id) => arr.find(x => x.id === id);
  const AR = '٠١٢٣٤٥٦٧٨٩';
  function digits(s) { return db.settings.arabicDigits ? String(s).replace(/\d/g, d => AR[d]) : String(s); }
  function num(n) { return digits((Math.round((Number(n) || 0) * 100) / 100).toLocaleString('en-US')); }
  function money(n) { return num(Math.round(Number(n) || 0)) + ' ' + db.settings.currency; }
  function fmtIn(n) { n = Math.round(Number(n) || 0); return n ? n.toLocaleString('en-US') : ''; }
  function toNum(v) {
    v = String(v == null ? '' : v).replace(/[٠-٩]/g, d => AR.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
      .replace(/٫/g, '.').replace(/[,،\s]/g, '');
    const n = parseFloat(v);
    return isFinite(n) ? n : 0;
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  // بحث مرن: يتجاهل الهمزات والتاء المربوطة والأرقام العربية/الهندية
  function norm(t) {
    return String(t == null ? '' : t).toLowerCase()
      .replace(/[٠-٩]/g, d => AR.indexOf(d)).replace(/[أإآٱ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي')
      .replace(/[\u064B-\u0652\u0640]/g, '').replace(/\s+/g, ' ').trim();
  }
  function matches(q, ...fields) {
    const nq = norm(q); if (!nq) return true;
    // عدة كلمات: كل كلمة لازم تكون موجودة (بأي ترتيب)
    if (nq.includes(' ')) { const all = norm(fields.join(' ')); return nq.split(' ').every(w => all.includes(w)); }
    const digitsQ = nq.replace(/\D/g, '');
    return fields.some(f => {
      const nf = norm(f);
      if (nf.includes(nq)) return true;
      // رقم الهاتف: نقارن الأرقام فقط (07xx أو 9647xx)
      if (digitsQ.length >= 3) { const df = nf.replace(/\D/g, ''); return df.includes(digitsQ) || df.includes(digitsQ.replace(/^0/, '')); }
      return false;
    });
  }
  // منع تكرار الأسماء (يتجاهل الفراغات والهمزات والتاء المربوطة)
  function nameTaken(list, name, selfId) {
    const n = norm(name);
    return list.find(x => x.id !== selfId && norm(x.name) === n);
  }
  // فحص الاسم أثناء الكتابة: يبين الأسماء المشابهة الموجودة، وينبه فوراً إذا الاسم مكرر
  const nameChecks = {};
  function nameInput(inputId, value, getList, selfId, label) {
    nameChecks[inputId] = { getList, selfId: selfId || '' };
    return `<label class="field" style="margin-bottom:4px"><span>${label}</span><input class="input" id="${inputId}" autocomplete="off" value="${esc(value || '')}" oninput="App.nameCheck('${inputId}')"></label>
      <div class="name-hint" id="${inputId}Hint"></div>`;
  }
  function nameCheck(inputId) {
    const cfg = nameChecks[inputId]; const box = document.getElementById(inputId + 'Hint'); const inp = document.getElementById(inputId);
    if (!cfg || !box || !inp) return;
    const q = inp.value.trim();
    if (!q) { box.innerHTML = ''; inp.classList.remove('dup'); return; }
    const others = cfg.getList().filter(x => x.id !== cfg.selfId);
    const exact = others.find(x => norm(x.name) === norm(q));
    const similar = others.filter(x => x !== exact && matches(q, x.name)).slice(0, 6);
    inp.classList.toggle('dup', !!exact);
    const chips = list => list.map(x => `<span class="name-chip">${esc(x.name)}</span>`).join('');
    box.innerHTML = exact
      ? `<div class="nh-bad">⚠️ هذا الاسم موجود: «${esc(exact.name)}»</div>${similar.length ? `<div class="nh-list">${chips(similar)}</div>` : ''}`
      : similar.length
        ? `<div class="nh-warn">أسماء مشابهة موجودة (${num(others.filter(x => matches(q, x.name)).length)}):</div><div class="nh-list">${chips(similar)}</div>`
        : `<div class="nh-ok">✓ الاسم غير مكرر</div>`;
  }
  function dupError(inputId, name) {
    const el = document.getElementById(inputId);

  }
  function fmtDate(d) { if (!d) return ''; const [y, m, dd] = d.split('-'); return digits(dd + '/' + m + '/' + y); }
  function monthName(ym) { const [y, m] = ym.split('-'); return MONTHS[Number(m) - 1] + ' ' + digits(y); }
  function val(id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; }
  function nval(id) { return toNum(val(id)); }

  // داخل إطار (رابط المعاينة) لا تعمل الطباعة ولا التنزيل
  const EMBED = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
  if (EMBED) document.documentElement.classList.add('embed');

  // نافذة تأكيد داخل الصفحة بدلاً من confirm/alert/prompt
  function ask(msg, o = {}) {
    return new Promise(res => {
      const d = $('#dlg');
      d.innerHTML = `<div class="dlg-box" role="alertdialog">
        <div class="dlg-msg">${esc(msg).replace(/\n/g, '<br>')}</div>
        ${o.input === 'area' ? '<textarea class="input" id="dlgIn" rows="6"></textarea>' : o.input ? '<input class="input" id="dlgIn">' : ''}
        ${o.html || ''}
        ${o.text != null ? `<textarea class="input" id="dlgText" rows="7" readonly>${esc(o.text)}</textarea>
          <button class="btn secondary block" id="dlgCopy" style="margin-top:8px">نسخ النص</button>` : ''}
        <div class="btn-row">
          ${o.cancel === false ? '' : `<button class="btn secondary" id="dlgNo">${o.cancelText || 'إلغاء'}</button>`}
          <button class="btn ${o.danger ? 'danger' : ''}" id="dlgYes">${o.ok || 'موافق'}</button>
        </div></div>`;
      d.hidden = false;
      const done = v => { d.hidden = true; d.innerHTML = ''; res(v); };
      $('#dlgYes').onclick = () => done(o.input ? val('dlgIn') : true);
      const no = $('#dlgNo'); if (no) no.onclick = () => done(o.input ? null : false);
      const cp = $('#dlgCopy');
      if (cp) cp.onclick = () => {
        const ta = $('#dlgText');
        navigator.clipboard.writeText(o.text).then(() => toast('تم النسخ')).catch(() => { ta.focus(); ta.select(); });
      };
      const inp = $('#dlgIn'); if (inp) setTimeout(() => inp.focus(), 50);
      d.querySelectorAll('a.dlg-close').forEach(a => a.addEventListener('click', () => setTimeout(() => done(true), 300)));
    });
  }

  let toastTimer;
  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2200);
  }

  // تنسيق حقول المبالغ أثناء الكتابة (250,000)
  document.addEventListener('input', e => {
    const el = e.target;
    if (el.classList && el.classList.contains('money')) {
      const n = Math.round(toNum(el.value));
      const f = el.value.trim() === '' ? '' : n.toLocaleString('en-US');
      if (el.value !== f) el.value = f;
    }
  });
  document.addEventListener('focusin', e => {
    const el = e.target;
    if (el.matches && el.matches('input.money, input.qty')) setTimeout(() => { try { el.select(); } catch (x) { /* */ } }, 0);
  });

  /* ---------- Calculations ---------- */
  const lineCost = s => sum(s.items, l => l.qty * l.cost);
  const saleProfit = s => s.total - lineCost(s);
  const openingOf = (arr, id) => { const c = byId(arr, id); return c ? Number(c.opening) || 0 : 0; };
  const customerBalance = id => openingOf(db.customers, id) +
    sum(db.sales.filter(s => s.customerId === id), s => s.total - s.paid) - sum(db.payments.filter(p => p.partyId === id), p => p.amount);
  const supplierBalance = id => openingOf(db.suppliers, id) +
    sum(db.purchases.filter(s => s.supplierId === id), s => s.total - s.paid) - sum(db.supplierPayments.filter(p => p.partyId === id), p => p.amount);
  const partyBalance = (kind, id) => kind === 'customer' ? customerBalance(id) : supplierBalance(id);
  // نص الرصيد: «عليه» = مطلوب لي، «له» = أنا مطلوب له
  function balWord(kind, bal) {
    if (!Math.round(bal)) return 'لا يوجد رصيد';
    const owesMe = kind === 'customer' ? bal > 0 : bal < 0;
    return (owesMe ? 'عليه ' : 'له ') + money(Math.abs(bal));
  }
  function balBadge(kind, bal) {
    if (!Math.round(bal)) return '<span class="badge b-green">لا يوجد رصيد</span>';
    const owesMe = kind === 'customer' ? bal > 0 : bal < 0;
    return `<span class="badge ${owesMe ? 'b-amber' : 'b-blue'}">${balWord(kind, bal)}</span>`;
  }
  const advBalance = empId =>
    sum(db.advances.filter(a => a.employeeId === empId), a => a.amount) - sum(db.payrolls.filter(p => p.employeeId === empId), p => p.advDeducted);
  const payrollCost = p => p.base + p.bonus - p.deduction;
  // كل الرواتب (الثابتة ورواتب الإنجاز) تُحسب مصروف ضمن بند الرواتب
  const payrollExpense = payrollCost;
  const isPiece = e => e && e.payType === 'piece';
  const monthLogs = (empId, month) => db.workLogs.filter(w => w.employeeId === empId && w.date.startsWith(month));
  const monthQty = (empId, month) => sum(monthLogs(empId, month), w => w.qty);
  const monthPieceAmount = (empId, month) => sum(monthLogs(empId, month), w => w.qty * w.rate);
  const expectedPay = (e, month) => isPiece(e) ? monthPieceAmount(e.id, month) : e.salary;
  const unitName = e => (e && e.unitName) || 'قطعة';
  const ownerName = id => { const o = byId(db.settings.owners, id); return o ? o.name : '—'; };

  function cashBox() {
    return (Number(db.settings.openingCash) || 0)
      + sum(db.sales, s => s.paid) + sum(db.payments, p => p.amount)
      - sum(db.purchases, s => s.paid) - sum(db.supplierPayments, p => p.amount)
      - sum(db.expenses, e => e.amount) - sum(db.advances, a => a.amount) - sum(db.payrolls, p => p.net)
      - sum(db.withdrawals, w => w.amount) + sum(db.incomes, x => x.amount)
      - sum(db.assets, a => a.cost) + sum(db.assets.filter(a => a.sold), a => a.saleAmount || 0);
  }
  function profitIn(from, to) {
    const inR = d => d >= from && d <= to;
    const sales = db.sales.filter(s => inR(s.date));
    const revenue = sum(sales, s => s.total);
    const cogs = sum(sales, lineCost);
    const expenses = sum(db.expenses.filter(e => inR(e.date)), e => e.amount);
    const salaries = sum(db.payrolls.filter(p => inR(p.date)), payrollExpense);
    const other = sum(db.incomes.filter(x => inR(x.date)), x => x.amount);
    // ربح أو خسارة بيع الثوابت (سعر البيع − سعر الشراء)
    const assetGain = sum(db.assets.filter(a => a.sold && inR(a.saleDate)), a => (a.saleAmount || 0) - a.cost);
    return { revenue, cogs, gross: revenue - cogs, other, assetGain, expenses, salaries, net: revenue - cogs + other + assetGain - expenses - salaries, count: sales.length };
  }

  /* ---------- Sheet (bottom modal) ---------- */

  // التحديث: يعيد فتح البرنامج بآخر نسخة، والبيانات محفوظة على الجهاز فلا تتأثر
  async function updateApp() {

    if (!EMBED && navigator.serviceWorker) {

  /* ---------- اختيار زبون/مورد مع بحث ---------- */
  const pickers = {};
  function partyPickerHTML(id, kind, selectedId, onPick, emptyLabel) {

        oninput="App.pickerFilter('${id}')" onfocus="App.pickerOpen('${id}')"></div>
      <div class="picker-list" id="${id}List" hidden></div>
    </div>`;
  }
  function pickerRender(id) {
    const cfg = pickers[id]; if (!cfg) return;
    const q = val(id + 'Q');
    const sel = val(id + 'Val');
    const selC = sel ? byId(PARTY[cfg.kind].list(), sel) : null;
    const showAll = selC && q === selC.name;
    const list = PARTY[cfg.kind].list()
      .filter(c => showAll || matches(q, c.name, c.phone, c.notes))
      .map(c => ({ c, b: partyBalance(cfg.kind, c.id) }))
      .sort((a, b) => Math.abs(b.b) - Math.abs(a.b) || a.c.name.localeCompare(b.c.name, 'ar'));
    const shown = list.slice(0, 40);
    $('#' + id + 'List').innerHTML =
      (cfg.emptyLabel ? `<div class="row" onclick="App.pickerPick('${id}','')"><div class="grow t muted">${esc(cfg.emptyLabel)}</div></div>` : '') +
      (shown.length ? shown.map(({ c, b }) => `<div class="row" onclick="App.pickerPick('${id}','${c.id}')">
        <div class="grow"><div class="t">${esc(c.name)}</div>${c.phone ? `<div class="s">${esc(digits(c.phone))}</div>` : ''}</div>
        <div class="end">${balBadge(cfg.kind, b)}</div></div>`).join('') : '<div class="empty small">لا يوجد اسم مطابق</div>') +
      (list.length > shown.length ? `<div class="small muted" style="padding:8px 14px">و ${num(list.length - shown.length)} آخرين… اكتب أكثر لتضييق البحث</div>` : '');
  }

  document.addEventListener('click', e => {
    Object.keys(pickers).forEach(id => {
      const box = document.getElementById(id);

  /* ---------- Router ---------- */
  const ROOTS = ['home', 'sales', 'stock', 'reports', 'more'];
  const TAB_OF = { 'sale-new': 'sales', 'purchase-new': 'more' };
  function setTop(title, action) {

  /* ---------- نطاق أرقام الحسابات (من - إلى) ---------- */
  function rangeCount(from, to) {
    const a = toNum(from), b = toNum(to);
    if (!String(from).trim() || !String(to).trim() || !/^\s*[\d٠-٩]+\s*$/.test(from) || !/^\s*[\d٠-٩]+\s*$/.test(to) || b < a) return 0;
    return b - a + 1;
  }
  const isNumStr = v => /^\s*[\d٠-٩]+\s*$/.test(String(v || ''));
  // نص النطاقات لسطر واحد: 1000-1500، 2000-2100
  function lineRangesText(l) {
    const rs = (l.ranges || []).filter(r => r.from || r.to);
    return rs.map(r => '\u2066' + digits([r.from, r.to].filter(Boolean).join('-')) + '\u2069').join('، ');
  }
  // البيان مع النطاقات: حساب ايكلود ( 1000-1500 )
  const lineLabel = l => { const r = lineRangesText(l); return r ? l.name + ' ( ' + r + ' )' : l.name; };
  const lineRangeCount = l => sum((l.ranges || []), r => rangeCount(r.from || '', r.to || ''));
  function allRanges(s) {
    const out = [];
    (s.items || []).forEach(l => (l.ranges || []).forEach(r => { if (r.from || r.to) out.push(r); }));
    if (s.rangeFrom || s.rangeTo) out.push({ from: s.rangeFrom, to: s.rangeTo });
    return out;
  }
  function rangeText(inv) {
    if (!inv.rangeFrom && !inv.rangeTo) return '';
    const n = rangeCount(inv.rangeFrom || '', inv.rangeTo || '');
    return 'من ' + digits(inv.rangeFrom || '—') + ' إلى ' + digits(inv.rangeTo || '—') + (n ? ' (' + num(n) + ' حساب)' : '');
  }

  /* ---------- Invoice editor (sale & purchase) ---------- */
  let ed = null;
  function newEd(kind) {

  }
  function edTotals() {
    const sub = sum(ed.lines, l => l.qty * l.price);
    const disc = Math.min(sub, Math.max(0, toNum(ed.discount)));
    const total = Math.max(0, sub - disc);
    const rawPaid = Math.max(0, toNum(ed.paid));
    const paid = ed.type === 'cash' ? total : Math.min(total, rawPaid);
    // دفعة على الحساب السابق: الحقل الخاص + أي زيادة بالمدفوع عن قيمة الفاتورة
    const overflow = ed.type === 'credit' ? Math.max(0, rawPaid - total) : 0;
    const extra = ed.partyId ? Math.round(Math.max(0, toNum(ed.oldPay)) + overflow) : 0;
    return { sub, disc, total, paid, rem: total - paid, extra };
  }
  function editor(kind) {
    if (!ed || ed.kind !== kind) ed = newEd(kind);

      </div>
      <div class="card">
        <label class="field"><span>${isSale ? 'الزبون' : 'المورد'} ${ed.type === 'credit' ? '(مطلوب)' : '(اختياري)'}</span>

            <div style="flex:1;min-width:0">${partyPickerHTML('edParty', isSale ? 'customer' : 'supplier', ed.partyId, id => App.edField('partyId', id), isSale ? 'زبون نقدي (ابحث لاختيار زبون)' : 'بدون مورد (ابحث لاختيار مورد)')}</div>
            <button class="btn secondary small" style="align-self:flex-start;height:46px" onclick="App.edNewParty()">+ جديد</button>

      <button class="btn secondary block" onclick="App.picker()">+ إضافة منتج</button>
      <div class="card" style="margin-top:12px">
        <div class="grid2">
          <label class="field"><span>الخصم</span><input class="input money" inputmode="numeric" placeholder="0" value="${fmtIn(ed.discount)}" oninput="App.edField('discount',this.value)"></label>
          ${ed.type === 'credit' ? `<label class="field"><span>المدفوع الآن</span><input class="input money" inputmode="numeric" placeholder="0" value="${fmtIn(ed.paid)}" oninput="App.edField('paid',this.value)"></label>` : '<div></div>'}
        </div>

    `);
  }
  // بطاقة حساب الزبون/المورد داخل الفاتورة: رصيده + تسجيل دفعة على حسابه السابق
  function edCreditHint() {
    if (!ed.partyId) return '';

    const bal = partyBalance(kind, ed.partyId);

      return `<div class="card" style="background:var(--blue-soft);color:var(--blue)">لهذا الزبون رصيد له: <b>${money(-bal)}</b> (أنت مطلوب له).
        ${ed.type === 'credit' && !toNum(ed.paid) ? '<br>✓ قيمة هذه الفاتورة تنخصم من رصيده تلقائياً.' : `<br><button class="btn small" style="margin-top:8px" onclick="App.edUseCredit()">خصم الفاتورة من رصيده</button>`}</div>`;

  function edRangeInfo() { return ''; }
  function stockOf(pid) { const p = byId(db.products, pid); return p ? p.qty : 0; }
  function edLinesHTML() {

      <div><div class="name">${esc(l.name)}</div>
      <div class="small muted">${ed.kind === 'sale' ? 'المتوفر بالمخزن: ' + num(stockOf(l.productId)) : 'سعر الكلفة للوحدة'}</div></div>

        <b id="lt${i}">${money(l.qty * l.price)}</b>
      </div>
      ${ed.kind === 'sale' ? `<div class="ranges">
        ${(l.ranges || []).map((r, j) => `<div class="range-row">
          <input class="input" dir="ltr" inputmode="numeric" placeholder="من" value="${esc(r.from)}" oninput="App.edRangeSet(${i},${j},'from',this.value)" id="rf${i}_${j}">
          <span class="muted">—</span>
          <input class="input" dir="ltr" inputmode="numeric" placeholder="إلى" value="${esc(r.to)}" oninput="App.edRangeSet(${i},${j},'to',this.value)">
          <button class="x-btn" onclick="App.edRangeDel(${i},${j})" aria-label="حذف النطاق">×</button>
        </div>`).join('')}
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
          <button class="link-btn" onclick="App.edRangeAdd(${i})">+ إضافة نطاق (أرقام الحسابات)</button>
          <span class="small" id="ri${i}">${lineRangeInfo(l)}</span>
        </div>
      </div>` : ''}
      </div>`).join('');
  }
  function lineRangeInfo(l) {
    const rs = (l.ranges || []).filter(r => r.from || r.to);
    if (!rs.length) return '';
    if (rs.some(r => isNumStr(r.from) && isNumStr(r.to) && !rangeCount(r.from, r.to))) return '<span class="neg">«إلى» أصغر من «من»</span>';
    const n = lineRangeCount(l);
    return n ? `<span class="muted">عدد الحسابات: <b>${num(n)}</b></span>${n !== l.qty ? ` <span class="neg">(الكمية ${num(l.qty)})</span>` : ''}` : '';
  }
  function edTotalsHTML() {
    const t = edTotals();

      ${t.disc ? `<div class="tr"><span class="muted">الخصم</span><span>− ${money(t.disc)}</span></div>` : ''}
      <div class="tr big"><span>الإجمالي</span><span>${money(t.total)}</span></div>
      ${ed.type === 'credit' ? `<div class="tr"><span class="muted">المدفوع</span><span>${money(t.paid)}</span></div>
      <div class="tr bold"><span>${ed.kind === 'sale' ? 'يضاف إلى حساب الزبون' : 'يضاف إلى حساب المورد'}</span><span class="neg">${money(t.rem)}</span></div>
` : ''}
      ${t.extra ? `<div class="tr bold"><span>${ed.kind === 'sale' ? 'دفعة على الحساب السابق' : 'تسديد من الحساب السابق'}</span><span class="pos">− ${money(t.extra)}</span></div>` : ''}
      ${ed.partyId ? `<div class="tr small"><span class="muted">رصيد الحساب بعد الفاتورة</span><span class="bold">${balWord(ed.kind === 'sale' ? 'customer' : 'supplier', partyBalance(ed.kind === 'sale' ? 'customer' : 'supplier', ed.partyId) + t.rem - t.extra)}</span></div>` : ''}`;
  }
  function edRefresh(lines) {
    if (lines) $('#edLines').innerHTML = edLinesHTML();

  function edAdd(p) {
    const ex = ed.lines.find(l => l.productId === p.id);
    if (ex) ex.qty = Math.round((ex.qty + 1) * 1000) / 1000;

  function picker() {
    const draw = q => {
      q = (q || '').trim();
      const list = db.products.filter(p => !q || p.name.includes(q) || (p.code && p.code === q));
      return list.length ? `<div class="list">${list.map(p => {

    `, () => { if (ed && $('#edLines')) edRefresh(true); });
  }
  let pickerDraw = null;
  async function edSave() {
    const isSale = ed.kind === 'sale';
    if (isSale && ed.lines.some(l => (l.ranges || []).some(r => isNumStr(r.from) && isNumStr(r.to) && !rangeCount(r.from, r.to)))) return toast('بالنطاقات: رقم «إلى» لازم يكون أكبر من «من»');
    const lines = ed.lines.filter(l => l.qty > 0);
    if (!lines.length) return toast('أضف منتجاً واحداً على الأقل');
    if (ed.type === 'credit' && !ed.partyId) return toast(isSale ? 'اختر الزبون للبيع الآجل' : 'اختر المورد للشراء الآجل');
    if (isSale) {
      const short = lines.filter(l => l.qty > stockOf(l.productId));
      if (short.length && !(await ask('الكمية المطلوبة أكبر من المتوفر في المخزن:\n' + short.map(l => '• ' + l.name + ' (المتوفر ' + num(stockOf(l.productId)) + ')').join('\n') + '\n\nهل تريد المتابعة؟'))) return;
    }
    const t = edTotals();
    const doc = {
      id: uid(), no: ++db.seq[ed.kind], date: ed.date || today(), type: ed.type,
      items: lines.map(l => Object.assign({ productId: l.productId, name: l.name, qty: l.qty, price: Math.round(l.price), cost: isSale ? (byId(db.products, l.productId) || l).cost : Math.round(l.price) },
        isSale && (l.ranges || []).some(r => r.from || r.to) ? { ranges: l.ranges.filter(r => r.from || r.to).map(r => ({ from: String(r.from || '').trim(), to: String(r.to || '').trim() })) } : {})),
      discount: t.disc, total: t.total, paid: t.paid, accountPay: t.extra || 0, note: ed.note, createdAt: new Date().toISOString(),
      rangeFrom: '', rangeTo: ''
    };
    // الدفعة على الحساب السابق تنحفظ كدفعة مربوطة بالفاتورة
    if (t.extra > 0) {
      (isSale ? db.payments : db.supplierPayments).push(Object.assign({ id: uid(), partyId: ed.partyId, amount: t.extra, date: doc.date, method: 'نقدي', note: 'دفعة مع فاتورة #' + doc.no, invoiceId: doc.id, createdAt: doc.createdAt }, isSale ? { no: ++db.seq.receipt } : {}));
    }
    if (isSale) {
      doc.customerId = ed.partyId;
      doc.items.forEach(l => { const p = byId(db.products, l.productId); if (p) p.qty = round3(p.qty - l.qty); });

  const round3 = n => Math.round(n * 1000) / 1000;

  function showInvoice(kind, id) {

  /* ---------- PDF ---------- */
  const H2C = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';

  let libsP = null;
  function loadScript(src) {
    return new Promise((res, rej) => { const el = document.createElement('script'); el.src = src; el.onload = res; el.onerror = () => rej(new Error('load ' + src)); document.head.appendChild(el); });
  }
  function loadPdfLibs() {

  let pdfBusy = false;
  async function makePDF(title, html, filename) {

      try { await loadPdfLibs(); }
      catch (e) { return ask('تعذر تجهيز ملف PDF. تأكد من اتصال الإنترنت وحاول مرة أخرى.', { cancel: false }); }
      const box = document.createElement('div');

        ${html}<div class="pdf-foot">صدر من برنامج حساباتي</div>`;
      document.body.appendChild(box);
      let blob;
      try {
        const scale = 2;
        const top0 = box.getBoundingClientRect().top;
        // مواضع القطع المسموحة بين الصفوف حتى لا ينقسم سطر بين صفحتين
        const breaks = Array.from(box.querySelectorAll('tr, .kv, .row, .stat, .card, .section-title, .pdf-head, .table-wrap, .line'))
          .map(el => Math.round((el.getBoundingClientRect().bottom - top0) * scale)).sort((a, b) => a - b);
        const canvas = await window.html2canvas(box, { scale, backgroundColor: '#ffffff', logging: false });
        const pdf = new window.jspdf.jsPDF({ unit: 'pt', format: 'a4' });
        const pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight(), m = 22;
        const iw = pw - 2 * m, ratio = iw / canvas.width;
        const pageH = Math.floor((ph - 2 * m) / ratio);
        let y = 0, first = true;
        while (y < canvas.height - 2) {
          let end = Math.min(canvas.height, y + pageH);
          if (end < canvas.height) {
            const cand = breaks.filter(b => b > y + pageH * 0.5 && b <= end);
            if (cand.length) end = cand[cand.length - 1];
          }
          const part = document.createElement('canvas');
          part.width = canvas.width; part.height = end - y;
          const ctx = part.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, part.width, part.height);
          ctx.drawImage(canvas, 0, y, canvas.width, end - y, 0, 0, canvas.width, end - y);
          if (!first) pdf.addPage();
          pdf.addImage(part.toDataURL('image/jpeg', 0.92), 'JPEG', m, m, iw, (end - y) * ratio);
          first = false; y = end;
        }
        blob = pdf.output('blob');
      } finally { box.remove(); }
      await deliverFile(blob, filename, title);

      console.error(e);

  /* ---------- فاتورة البيع بتصميم المحل ---------- */

  function templatePages(inv, im) {

      const rem = inv.total - inv.paid;

        // رقم الحساب تحت اسم الزبون مباشرة، مثل 20-30
        inv.rangeFrom || inv.rangeTo ? ['رقم الحساب', '\u2066' + digits([inv.rangeFrom, inv.rangeTo].filter(Boolean).join('-')) + '\u2069'] : null,
        ['نوع الفاتورة', inv.type === 'credit' ? 'آجل' : 'نقدي'],
        inv.discount ? ['الخصم', money(inv.discount)] : null,
        ['الدفعة المستلمة', money(inv.paid)],
        ['المتبقي', money(rem), rem > 0 ? '#dc2626' : '#15803d'],
        inv.accountPay ? ['دفعة على الحساب', money(inv.accountPay), '#15803d'] : null

      if (cust && (inv.type === 'credit' || inv.accountPay || Math.round(customerBalance(cust.id)))) {
        const b = customerBalance(cust.id);
        rows.push(['رصيد الحساب', !Math.round(b) ? 'مسدد' : (b > 0 ? 'مطلوب منكم ' : 'لكم ') + money(Math.abs(b)), b > 0 ? '#dc2626' : '#15803d']);

  /* ---------- واتساب ---------- */
  function waNumber(phone) {
    let d = String(phone || '').replace(/[٠-٩]/g, ch => AR.indexOf(ch)).replace(/\D/g, '');
    if (!d) return '';
    if (d.startsWith('00')) d = d.slice(2);
    if (d.startsWith('0')) d = '964' + d.slice(1);
    else if (d.length === 10 && d[0] === '7') d = '964' + d;
    return d.length >= 11 ? d : '';
  }
  const waLink = (phone, text) => 'https://wa.me/' + waNumber(phone) + '?text=' + encodeURIComponent(text);
  function offerWhatsApp(inv) {
    const cust = byId(db.customers, inv.customerId);
    if (!cust || !waNumber(cust.phone)) return;
    ask(`تم تجهيز ملف الفاتورة.\nافتح محادثة ${cust.name} على واتساب، الرسالة جاهزة وما عليك إلا تضغط «إرسال».`, {
      cancel: false, ok: 'إغلاق',
      html: `<a class="btn block wa-btn dlg-close" href="${esc(waLink(cust.phone, invoiceText('sale', inv)))}" target="_blank" rel="noopener">فتح واتساب ${esc(cust.name)}</a>`
    });

  async function deliverFile(blob, filename, title) {
    if (EMBED) {
      const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
      if (!dl) return ask('حفظ الملفات غير متاح في هذه الصفحة.', { cancel: false });
      try { await dl.save({ filename, data: blob }); toast('تم'); }
      catch (e) { if (e && e.code !== 'declined') ask('تعذر حفظ الملف. حاول مرة أخرى بعد قليل.', { cancel: false }); }
      return;
    }
    const file = new File([blob], filename, { type: blob.type || 'application/octet-stream' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title }); return; }
      catch (e) { if (e.name === 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file); a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast('تم تنزيل الملف');
  }

      </div>
      <div class="bold" style="margin:4px 4px 6px">طريقة حساب الراتب</div>
      <div class="seg" id="emTypeSeg">
        <button type="button" data-t="monthly" class="${!isPiece(e) ? 'on' : ''}" onclick="App.setPayType(this)">راتب شهري ثابت</button>
        <button type="button" data-t="piece" class="${isPiece(e) ? 'on' : ''}" onclick="App.setPayType(this)">حسب الإنجاز (بالقطعة)</button>
      </div>
      <div id="emMonthly" ${isPiece(e) ? 'hidden' : ''}>
        <label class="field"><span>الراتب الشهري *</span><input class="input money" inputmode="numeric" id="emSal" value="${fmtIn(e ? e.salary : 0)}" placeholder="0"></label>
      </div>
      <div id="emPiece" ${isPiece(e) ? '' : 'hidden'}>
        <div class="grid2">
          <label class="field"><span>اسم العمل</span><input class="input" id="emUnit" value="${esc(e && e.unitName ? e.unitName : 'ايميل')}"></label>
          <label class="field"><span>المبلغ لكل قطعة *</span><input class="input money" inputmode="numeric" id="emRate" value="${fmtIn(e ? e.rate : 200)}" placeholder="200"></label>
        </div>
        <div class="card small muted">الراتب نهاية الشهر = عدد الأعمال المنجزة × المبلغ لكل قطعة، ويُحسب مصروف ضمن بند الرواتب.</div>
      </div>
      <label class="field"><span>تاريخ المباشرة</span><input type="date" class="input" id="emStart" value="${e ? e.startDate || '' : today()}"></label>
